concurrency: 8
ssh:
  default_user: deploy
  default_port: 22
  connect_timeout: 10s
  command_timeout: 5m
  known_hosts: ~/.ssh/known_hosts
  default_private_key: ~/.ssh/id_ed25519
scan_roots:
  - /var/www
  - /opt
  - /srv
  - /app
  - $HOME
targets:
  - name: web-01
    kind: vm
    host: 10.0.0.11
    user: deploy
    port: 22
    private_key: ~/.ssh/id_ed25519
    tags: [prod, web]
    enabled: true
  - name: app-lxc-01
    kind: lxc
    host: 10.0.0.21
    user: root
    tags: [prod, app]
    enabled: true
