# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: pachingo

before:
  hooks:
    - go mod tidy

builds:
  - id: pachingo-linux
    main: ./cmd/pachingo
    binary: pachingo
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))?!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\(.+\))?!?:.+$'
      order: 1
    - title: Documentation
      regexp: '^.*?docs(\(.+\))?!?:.+$'
      order: 2
    - title: Maintenance
      regexp: '^.*?(chore|ci|refactor|perf|style|test|build)(\(.+\))?!?:.+$'
      order: 3
    - title: Others
      order: 999
  filters:
    exclude:
      - '^Merge pull request'
      - '^Merge branch'
      - '^Initial commit'

release:
  draft: false
  prerelease: auto
