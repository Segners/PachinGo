name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l ./cmd ./internal ./desktop/*.go)" ]; then
            echo "The following files need gofmt:"
            gofmt -l ./cmd ./internal ./desktop/*.go
            exit 1
          fi

      - name: Run go vet
        run: go vet ./cmd/... ./internal/...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m ./cmd/... ./internal/...

      - name: Run Unit Tests (with Race Detector)
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./cmd/... ./internal/...

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage.txt
          if-no-files-found: ignore

      - name: Cross-Platform Build Verification
        run: |
          GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/pachingo
          GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/pachingo

      - name: Build desktop package
        run: |
          cd desktop/frontend && npm ci && npm run build
          cd ../.. && go build -o /dev/null ./desktop/
